<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>browser-mcp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; color: #1a1a1a; background: #fff; }
    .header { padding: 14px 16px 10px; border-bottom: 1px solid #eee; display: flex;
      align-items: center; gap: 8px; }
    .logo { width: 22px; height: 22px; background: #2563eb; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 11px; flex-shrink: 0; }
    .title { font-weight: 600; font-size: 14px; }
    .subtitle { font-size: 11px; color: #888; margin-top: 1px; }
    .section { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    .label { color: #555; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red   { background: #fee2e2; color: #dc2626; }
    .badge-gray  { background: #f3f4f6; color: #6b7280; }
    .url { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; color: #2563eb;
      background: #eff6ff; padding: 4px 8px; border-radius: 4px; word-break: break-all;
      margin-top: 6px; }
    .footer { padding: 10px 16px; }
    button { width: 100%; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #f9fafb; cursor: pointer; font-size: 12px; color: #374151;
      transition: background 0.15s; }
    button:hover { background: #f3f4f6; }
    #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 4px; background: #d1d5db; }
    #dot.green { background: #22c55e; }
    #dot.red   { background: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <div>
      <div class="title">browser-mcp</div>
      <div class="subtitle">Browser automation for AI agents</div>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <span class="label"><span id="dot"></span>Relay connection</span>
      <span id="status-badge" class="badge badge-gray">—</span>
    </div>
    <div class="row">
      <span class="label">MCP endpoint</span>
    </div>
    <div class="url">http://127.0.0.1:3000/mcp</div>
  </div>

  <div class="footer">
    <button id="retry-btn">Retry connection</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
